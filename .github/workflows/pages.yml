name: Publicar en GitHub Pages

# Publica la app real (React Native corriendo en web) en la raíz del sitio.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: movil/package-lock.json

      - name: Instalar dependencias
        working-directory: movil
        run: npm ci

      - name: Comprobar credenciales
        # Informa si los secretos del repositorio llegaron, sin revelarlos.
        # La app compila igual sin ellos: cae a los datos locales.
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          LLAVE: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$URL" ]; then
            echo "SUPABASE_URL      : configurada (${#URL} caracteres)"
          else
            echo "SUPABASE_URL      : FALTA"
          fi
          if [ -n "$LLAVE" ]; then
            echo "SUPABASE_ANON_KEY : configurada (${#LLAVE} caracteres)"
          else
            echo "SUPABASE_ANON_KEY : FALTA"
          fi

      - name: Compilar la app para web
        working-directory: movil
        # La llave anónima de Supabase es pública por diseño y viaja dentro de
        # la aplicación; lo que protege los datos son las políticas de seguridad
        # por fila. Aun así se guarda como secreto del repositorio para no
        # dejarla escrita en el código. Si no están configuradas, la app compila
        # igual y funciona con los datos locales.
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npx expo export --platform web --output-dir ../sitio

      - name: Preparar el sitio
        run: |
          # GitHub Pages no reescribe rutas hacia el index. Una copia como
          # 404.html hace que los enlaces profundos y los refrescos funcionen
          # en una aplicación de una sola página.
          cp sitio/index.html sitio/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
